<text x="70" y="34" font-size="19" font-weight="600" fill="#1a1a19">F1 by k for three attack sets, NSL-KDD paper split, mean of 3 seeds</text>
<text x="70" y="56" fill="#6b6a63">Same metric in every panel: F1 of the attack verdict over the attacks named in the panel title plus all 874 normal flows of each seed, so a false alarm</text>
<text x="70" y="74" fill="#6b6a63">on normal traffic lowers F1 everywhere. The panels differ only in which attacks count: all 1,126; the 826 of types present in the example pool; the 300 of types absent from it.</text>
<text x="70" y="92" fill="#6b6a63">k = labeled examples per category in the prompt; "all" = the forests fitted on the whole pool. Same y scale in the three panels.</text>
