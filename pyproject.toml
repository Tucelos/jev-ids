[project]
name = "jev-ids"
version = "0.1.0"
description = "Intrusion detection with TypeSafe's Jev, a System One Model: one network flow per request, one typed verdict"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "agno[openai]>=3.0.10",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "typesafe-sdk>=0.7.1",
]

[project.scripts]
jev-ids = "jev_ids.cli:main"

# The console script above needs the project installed as a package; hatchling ships the flat `jev_ids/` folder and nothing else.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_ids"]

# --- quality gate (added by /quality-init); thresholds live here ---
[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90", "PL", "S", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--cov --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["tests/*"]

[tool.vulture]
paths = ["."]
exclude = [".venv/", "tests/"]
min_confidence = 80

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "kaggle>=2.2.4",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "types-requests>=2.33.0.20260906",
    "vulture>=2.16",
]
